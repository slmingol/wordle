name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/MikhaD/wordle.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          COUNT=$(git log HEAD..upstream/main --oneline | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "0" ]; then
            echo "New upstream commits: $COUNT"
            git log HEAD..upstream/main --oneline
          else
            echo "Already up to date with upstream."
          fi

      - name: Merge upstream into main (clean)
        if: steps.check.outputs.count > 0
        id: merge
        run: |
          COUNT="${{ steps.check.outputs.count }}"
          COMMITS=$(git log HEAD..upstream/main --oneline | head -20)

          if git merge upstream/main --no-edit -m "chore: sync $COUNT commits from upstream MikhaD/wordle"; then
            git push origin main
            echo "result=pushed" >> "$GITHUB_OUTPUT"
            echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"
          else
            echo "Merge has conflicts — opening PR for manual resolution"
            git merge --abort
            BRANCH="sync/upstream-$(date +%Y-%m-%d)"
            git checkout -b "$BRANCH"
            git merge upstream/main --no-edit -m "chore: sync upstream MikhaD/wordle (CONFLICTS)" || true
            git add -A
            git commit --allow-empty -m "chore: sync upstream MikhaD/wordle (CONFLICTS — needs manual resolution)"
            git push origin "$BRANCH"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR (conflicts only)
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.merge.outputs.branch }}"
          COUNT="${{ steps.check.outputs.count }}"
          COMMITS="${{ steps.merge.outputs.commits }}"

          gh pr create \
            --title "chore: sync upstream ($COUNT commits) — CONFLICTS need resolution" \
            --body "## Upstream sync (conflicts)

Merge from [MikhaD/wordle](https://github.com/MikhaD/wordle) has **conflicts** that need manual resolution before merging.

**New upstream commits ($COUNT):**
\`\`\`
$COMMITS
\`\`\`

### To resolve
\`\`\`bash
git fetch origin
git checkout $BRANCH
git status   # see conflicted files
# resolve conflicts, then:
git add .
git commit --amend --no-edit
git push --force-with-lease origin $BRANCH
\`\`\`" \
            --base main \
            --head "$BRANCH" \
            --label "upstream-sync" 2>/dev/null || \
          gh pr create \
            --title "chore: sync upstream ($COUNT commits) — CONFLICTS need resolution" \
            --body "Conflicts from upstream MikhaD/wordle — resolve manually." \
            --base main \
            --head "$BRANCH"

      - name: Summary
        if: steps.check.outputs.count > 0
        run: |
          if [ "${{ steps.merge.outputs.result }}" = "pushed" ]; then
            echo "✓ Pushed ${{ steps.check.outputs.count }} upstream commits directly to main"
          else
            echo "⚠ Conflicts detected — PR opened for manual resolution"
          fi
